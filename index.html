<!DOCTYPE html>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-main: #050814;
      --neon-cyan: #00f5ff;
      --neon-purple: #b400ff;
      --text-main: #e5e9ff;
      --text-muted: #9aa0c6;
    }

    body {
      font-family: "Roboto", sans-serif;
      background: radial-gradient(circle at top, #101633 0, #050814 55%, #02030a 100%);
      color: var(--text-main);
      margin: 0;
    }

    header {
      padding: 2rem 8vw;
      border-bottom: 1px solid rgba(0, 245, 255, 0.15);
      background: linear-gradient(135deg, rgba(0, 245, 255, 0.08), rgba(180, 0, 255, 0.08));

      position: relative;
      text-align: center;
    }

    .lang-switch {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
    }

    .logo-image {
      width: 420px;
      height: auto;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 12px #00f5ff) drop-shadow(0 0 24px #b400ff);
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 1rem;
    }

    nav a {
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }

    nav a:hover { color: var(--text-main); }

    main { padding: 2.5rem 8vw; }

    footer {
      padding: 1.8rem 8vw;
      border-top: 1px solid rgba(0, 245, 255, 0.15);
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
